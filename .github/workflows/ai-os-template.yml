name: AI OS template

on:
  pull_request:
    paths:
      - "ai-os-template/**"
      - ".github/workflows/ai-os-template.yml"
  push:
    branches:
      - main
    paths:
      - "ai-os-template/**"
      - ".github/workflows/ai-os-template.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-os-template
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/ai-os-doctor.mjs --json
      - run: node tests/ai-os-runtime/run.mjs
      - run: npm run test:proof-harness
